name: CI/CD Pipeline - Content Marketing Optimizer

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  # -------------------------------
  # Code Quality & Linting
  # -------------------------------
  lint:
    name: Code Quality Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Upgrade pip
        run: |
          python -m pip install --upgrade pip

      - name: Install tools
        run: |
          pip install flake8 pylint black isort
          pip install -r requirements.txt

      - name: Check formatting
        run: black --check . || true

      - name: Check import sorting
        run: isort --check-only . || true

      - name: Run flake8
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 . --count --exit-zero --max-line-length=127 --statistics

      - name: Run pylint
        run: |
          pylint app run.py streamlit_app.py --disable=R,C --fail-under=5 || true

  # -------------------------------
  # Security Analysis
  # -------------------------------
  security:
    name: Security Analysis
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install packages
        run: |
          pip install bandit safety
          pip install -r requirements.txt

      - name: Run Bandit
        run: |
          bandit -r app run.py streamlit_app.py -f json -o bandit-report.json || true

      - name: Run Safety
        run: |
          safety check || true

  # -------------------------------
  # Unit Tests
  # -------------------------------
  test:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-mock

      - name: Run Tests
        run: |
          if [ -d tests ]; then
            pytest tests -v --cov=app --cov-report=xml
          else
            echo "No tests directory found. Skipping tests."
          fi

      - name: Upload Coverage
        uses: codecov/codecov-action@v4
        with:
          files: coverage.xml
        continue-on-error: true

  # -------------------------------
  # Dependency Check
  # -------------------------------
  dependencies:
    name: Dependency Analysis
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Verify requirements
        run: |
          pip install -r requirements.txt --dry-run

      - name: Show outdated packages
        run: |
          pip list --outdated || true

  # -------------------------------
  # Build Check
  # -------------------------------
  build:
    name: Build & Streamlit Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Check Python files
        run: |
          python -m py_compile run.py
          python -m py_compile streamlit_app.py

  # -------------------------------
  # Summary
  # -------------------------------
  summary:
    name: CI/CD Pipeline Summary
    runs-on: ubuntu-latest

    needs:
      - lint
      - security
      - test
      - dependencies
      - build

    if: always()

    steps:
      - name: Summary
        run: |
          echo "✅ CI/CD Pipeline Finished"
          echo "Repository: ${{ github.repository }}"
          echo "Branch: ${{ github.ref_name }}"
          echo "Commit: ${{ github.sha }}"
          echo "Author: ${{ github.actor }}"
