name: CI/CD Pipeline - Content Marketing Optimizer

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  lint:
    name: Code Quality Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install flake8 pylint black isort

      - name: Black
        run: black --check . || true

      - name: isort
        run: isort --check-only . || true

      - name: Flake8
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 . --count --exit-zero --max-line-length=127 --statistics

      - name: Pylint
        run: |
          pylint app run.py streamlit_app.py --disable=R,C --fail-under=5 || true

  security:
    name: Security Analysis
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install bandit safety

      - name: Bandit
        run: |
          bandit -r app run.py streamlit_app.py -f json -o bandit-report.json || true

      - name: Safety
        run: safety check || true

  test:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-mock

      - name: Run Tests
        run: |
          if [ -d tests ]; then
            pytest tests -v --cov=app --cov-report=xml
          else
            echo "No tests found. Skipping."
          fi

      - name: Upload Coverage
        uses: codecov/codecov-action@v4
        with:
          files: coverage.xml
        continue-on-error: true

  dependencies:
    name: Dependency Analysis
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Verify requirements
        run: pip install -r requirements.txt --dry-run

      - name: Outdated Packages
        run: pip list --outdated || true

  build:
    name: Build & Streamlit Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Compile Python
        run: |
          python -m py_compile run.py
          python -m py_compile streamlit_app.py

  summary:
    name: Pipeline Summary
    runs-on: ubuntu-latest

    needs:
      - lint
      - security
      - test
      - dependencies
      - build

    if: always()

    steps:
      - run: |
          echo "Pipeline Finished"
          echo "Repository: ${{ github.repository }}"
          echo "Branch: ${{ github.ref_name }}"
          echo "Commit: ${{ github.sha }}"
          echo "Actor: ${{ github.actor }}"
