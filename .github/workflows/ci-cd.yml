name: CI/CD Pipeline - Content Marketing Optimizer

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  # Code Quality & Linting
  lint:
    runs-on: ubuntu-latest
    name: Code Quality Check
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install linting tools
        run: |
          pip install flake8 pylint black isort
      
      - name: Check code formatting with black
        run: black --check . || true
      
      - name: Sort imports with isort
        run: isort --check-only . || true
      
      - name: Lint with flake8
        run: |
          # Stop the build if there are Python syntax errors or undefined names
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          # Exit-zero treats all errors as warnings
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
        continue-on-error: true
      
      - name: Analyze with pylint
        run: |
          pip install -r requirements.txt
          pylint app/ run.py streamlit_app.py --disable=R,C --fail-under=5.0 || true
        continue-on-error: true

  # Security Scanning
  security:
    runs-on: ubuntu-latest
    name: Security Analysis
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install security tools
        run: |
          pip install bandit safety
      
      - name: Run Bandit security scan
        run: |
          bandit -r app/ run.py streamlit_app.py -f json -o bandit-report.json || true
        continue-on-error: true
      
      - name: Check dependencies with Safety
        run: |
          pip install -r requirements.txt
          safety check --json || true
        continue-on-error: true

  # Unit Tests
  test:
    runs-on: ubuntu-latest
    name: Unit Tests (Python ${{ matrix.python-version }})
    
    strategy:
      matrix:
        python-version: ['3.9', '3.11']
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
      
      - name: Cache pip packages
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-mock
      
      - name: Run unit tests
        run: |
          pytest tests/ -v --cov=app --cov-report=xml --cov-report=html || true
        continue-on-error: true
      
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        if: matrix.python-version == '3.11'
        with:
          file: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

  # Dependency Check
  dependencies:
    runs-on: ubuntu-latest
    name: Dependency Analysis
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Check for outdated packages
        run: |
          pip install --upgrade pip
          pip list --outdated || true
      
      - name: Verify requirements.txt integrity
        run: |
          pip install -r requirements.txt --dry-run
        continue-on-error: true

  # Build & Streamlit Check
  build:
    runs-on: ubuntu-latest
    name: Build & Streamlit App Check
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
      
      - name: Verify Streamlit app syntax
        run: |
          python -m py_compile streamlit_app.py
      
      - name: Verify main scripts compile
        run: |
          python -m py_compile run.py

  # Final Summary
  summary:
    runs-on: ubuntu-latest
    name: CI/CD Pipeline Summary
    needs: [lint, security, test, dependencies, build]
    if: always()
    
    steps:
      - name: Pipeline Status
        run: |
          echo "✅ CI/CD Pipeline Completed!"
          echo "📊 Status: ${{ job.status }}"
          echo "🔗 Commit: ${{ github.sha }}"
          echo "👤 Author: ${{ github.actor }}"
